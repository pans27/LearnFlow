  /api/courses/{courseId}/resources/search:
    get:
      x-implementation-status: implemented
      tags:
      - Resources
      operationId: get_api_courses_courseId_resources_search
      summary: Search PDF contents in course
      description: Search authorized extracted PDF page text in this course using PostgreSQL English web-search syntax.
        Requires course access; resource visibility matches resource listing, including own private notes and instructor-managed
        hidden materials. q must be one nonempty trimmed string of at most 200 characters; duplicate q parameters
        return 400. Returns resource metadata with plain-text page/snippet matches, at most five matching pages per
        resource and 250 page hits overall, newest resource first with page order ascending. No pagination. Empty
        matches return []. OCR is not implemented, so image-only PDFs without a text layer have no searchable text.
      parameters:
      - $ref: '#/components/parameters/courseId'
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
        description: Search keywords
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Returns an empty array when no items match.
