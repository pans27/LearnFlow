components:
  parameters:
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 2147483647
    courseId:
      name: courseId
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 2147483647
    announcementId:
      name: announcementId
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 2147483647
    assignmentId:
      name: assignmentId
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 2147483647
    submissionId:
      name: submissionId
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 2147483647
    quizId:
      name: quizId
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 2147483647
    questionId:
      name: questionId
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 2147483647
    resourceId:
      name: resourceId
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 2147483647
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: learnflow.sid
      description: HttpOnly HS256 JWT cookie backed by a revocable PostgreSQL session. Protect cookie-authenticated
        mutations against CSRF.
  schemas:
    UpdateEnrollmentRequest:
      type: "object"
      additionalProperties: false
      properties:
        role:
          type: "string"
          enum: ["student","instructor"]
      required: ["role"]
    CreateEnrollmentRequest:
      type: "object"
      additionalProperties: false
      properties:
        userId:
          type: "integer"
          format: "int32"
          minimum: 1
          maximum: 2147483647
        role:
          type: "string"
          enum: ["student","instructor"]
      required: ["userId","role"]
    CourseStatusRequest:
      type: "object"
      additionalProperties: false
      properties:
        status:
          type: "string"
          enum: ["active","archived"]
      required: ["status"]
    UpdateCourseRequest:
      type: "object"
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 200
          description: "Trimmed before validation; whitespace-only values are rejected."
        courseCode:
          type: "string"
          minLength: 1
          maxLength: 50
        description:
          type: "string"
          nullable: true
          maxLength: 10000
    CreateCourseRequest:
      type: "object"
      additionalProperties: false
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 200
          description: "Trimmed before validation; whitespace-only values are rejected."
        courseCode:
          type: "string"
          minLength: 1
          maxLength: 50
          description: "Defaults to name when omitted."
        description:
          type: "string"
          nullable: true
          maxLength: 10000
      required: ["name"]
    UpdateUserRequest:
      type: "object"
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 200
          description: "Trimmed before validation; whitespace-only values are rejected."
        isAdmin:
          type: "boolean"
    LoginRequest:
      type: "object"
      additionalProperties: false
      properties:
        email:
          type: "string"
          format: "email"
          maxLength: 320
          description: "Trimmed and normalized to lowercase."
        password:
          type: "string"
          format: "password"
          writeOnly: true
          minLength: 1
          maxLength: 128
      required: ["email","password"]
    Health:
      type: "object"
      additionalProperties: false
      properties:
        status:
          type: "string"
          enum: ["ok"]
      required: ["status"]
    Error:
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
      required:
      - message
    User:
      type: object
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        name:
          type: string
        email:
          type: string
          format: email
        isAdmin:
          type: boolean
        mustChangePassword:
          type: boolean
          readOnly: true
          description: True until the user replaces the administrator-generated temporary password.
      required: ["id", "name", "email", "isAdmin", "mustChangePassword"]
    CreateUserRequest:
      type: "object"
      additionalProperties: false
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 200
          description: "Trimmed before validation; whitespace-only values are rejected."
        email:
          type: "string"
          format: "email"
          maxLength: 320
          description: "Trimmed and normalized to lowercase."
        isAdmin:
          type: "boolean"
          default: false
      required: ["name","email"]
    CreateUserResponse:
      type: object
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/User'
        temporaryPassword:
          type: string
          format: password
          minLength: 16
          readOnly: true
          description: Server-generated random password, exposed only in the administrator's creation response.
      required:
      - user
      - temporaryPassword
    ChangePasswordRequest:
      type: "object"
      additionalProperties: false
      properties:
        currentPassword:
          type: "string"
          format: "password"
          writeOnly: true
          minLength: 1
          maxLength: 128
        newPassword:
          type: "string"
          format: "password"
          writeOnly: true
          minLength: 12
          maxLength: 128
          description: "Must differ from the current password."
      required: ["currentPassword","newPassword"]
    Course:
      type: object
      example:
        id: 1
        name: Software Engineering
        courseCode: ECE1724
        description: Course overview
        status: active
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        name:
          type: string
        courseCode:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - active
          - archived
        role:
          type: string
          enum:
          - instructor
          - student
          - null
          nullable: true
      required: ["id", "name", "courseCode", "description", "status"]
    BulkEnrollmentRequest:
      type: object
      additionalProperties: false
      required: [enrollments]
      properties:
        enrollments:
          type: array
          minItems: 1
          maxItems: 100
          description: User IDs must be unique within the batch.
          items:
            type: object
            additionalProperties: false
            required: [userId, role]
            properties:
              userId:
                type: integer
                format: int32
                minimum: 1
                maximum: 2147483647
                description: A positive PostgreSQL integer ID.
              role:
                type: string
                enum: [student, instructor]
      example:
        enrollments:
        - userId: 2
          role: student
        - userId: 3
          role: instructor
    BulkEnrollmentRemovalRequest:
      type: object
      additionalProperties: false
      required: [userIds]
      properties:
        userIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: integer
            format: int32
            minimum: 1
            maximum: 2147483647
            description: A positive PostgreSQL integer ID.
      example:
        userIds: [2, 3]
    Enrollment:
      type: object
      properties:
        userId:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        courseId:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        role:
