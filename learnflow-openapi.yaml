components:
  parameters:
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 2147483647
    courseId:
      name: courseId
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 2147483647
    announcementId:
      name: announcementId
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 2147483647
    assignmentId:
      name: assignmentId
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 2147483647
    submissionId:
      name: submissionId
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 2147483647
    quizId:
      name: quizId
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 2147483647
    questionId:
      name: questionId
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 2147483647
    resourceId:
      name: resourceId
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 2147483647
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: learnflow.sid
      description: HttpOnly HS256 JWT cookie backed by a revocable PostgreSQL session. Protect cookie-authenticated
        mutations against CSRF.
  schemas:
    UpdateEnrollmentRequest:
      type: "object"
      additionalProperties: false
      properties:
        role:
          type: "string"
          enum: ["student","instructor"]
      required: ["role"]
    CreateEnrollmentRequest:
      type: "object"
      additionalProperties: false
      properties:
        userId:
          type: "integer"
          format: "int32"
          minimum: 1
          maximum: 2147483647
        role:
          type: "string"
          enum: ["student","instructor"]
      required: ["userId","role"]
    CourseStatusRequest:
      type: "object"
      additionalProperties: false
      properties:
        status:
          type: "string"
          enum: ["active","archived"]
      required: ["status"]
    UpdateCourseRequest:
      type: "object"
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 200
          description: "Trimmed before validation; whitespace-only values are rejected."
        courseCode:
          type: "string"
          minLength: 1
          maxLength: 50
        description:
          type: "string"
          nullable: true
          maxLength: 10000
    CreateCourseRequest:
      type: "object"
      additionalProperties: false
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 200
          description: "Trimmed before validation; whitespace-only values are rejected."
        courseCode:
          type: "string"
          minLength: 1
          maxLength: 50
          description: "Defaults to name when omitted."
        description:
          type: "string"
          nullable: true
          maxLength: 10000
      required: ["name"]
    UpdateUserRequest:
      type: "object"
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 200
          description: "Trimmed before validation; whitespace-only values are rejected."
        isAdmin:
          type: "boolean"
    LoginRequest:
      type: "object"
      additionalProperties: false
      properties:
        email:
          type: "string"
          format: "email"
          maxLength: 320
          description: "Trimmed and normalized to lowercase."
        password:
          type: "string"
          format: "password"
          writeOnly: true
          minLength: 1
          maxLength: 128
      required: ["email","password"]
    Health:
      type: "object"
      additionalProperties: false
      properties:
        status:
          type: "string"
          enum: ["ok"]
      required: ["status"]
    Error:
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
      required:
      - message
    User:
      type: object
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        name:
          type: string
        email:
          type: string
          format: email
        isAdmin:
          type: boolean
        mustChangePassword:
          type: boolean
          readOnly: true
          description: True until the user replaces the administrator-generated temporary password.
      required: ["id", "name", "email", "isAdmin", "mustChangePassword"]
    CreateUserRequest:
      type: "object"
      additionalProperties: false
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 200
          description: "Trimmed before validation; whitespace-only values are rejected."
        email:
          type: "string"
          format: "email"
          maxLength: 320
          description: "Trimmed and normalized to lowercase."
        isAdmin:
          type: "boolean"
          default: false
      required: ["name","email"]
    CreateUserResponse:
      type: object
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/User'
        temporaryPassword:
          type: string
          format: password
          minLength: 16
          readOnly: true
          description: Server-generated random password, exposed only in the administrator's creation response.
      required:
      - user
      - temporaryPassword
    ChangePasswordRequest:
      type: "object"
      additionalProperties: false
      properties:
        currentPassword:
          type: "string"
          format: "password"
          writeOnly: true
          minLength: 1
          maxLength: 128
        newPassword:
          type: "string"
          format: "password"
          writeOnly: true
          minLength: 12
          maxLength: 128
          description: "Must differ from the current password."
      required: ["currentPassword","newPassword"]
    Course:
      type: object
      example:
        id: 1
        name: Software Engineering
        courseCode: ECE1724
        description: Course overview
        status: active
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        name:
          type: string
        courseCode:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - active
          - archived
        role:
          type: string
          enum:
          - instructor
          - student
          - null
          nullable: true
      required: ["id", "name", "courseCode", "description", "status"]
    BulkEnrollmentRequest:
      type: object
      additionalProperties: false
      required: [enrollments]
      properties:
        enrollments:
          type: array
          minItems: 1
          maxItems: 100
          description: User IDs must be unique within the batch.
          items:
            type: object
            additionalProperties: false
            required: [userId, role]
            properties:
              userId:
                type: integer
                format: int32
                minimum: 1
                maximum: 2147483647
                description: A positive PostgreSQL integer ID.
              role:
                type: string
                enum: [student, instructor]
      example:
        enrollments:
        - userId: 2
          role: student
        - userId: 3
          role: instructor
    BulkEnrollmentRemovalRequest:
      type: object
      additionalProperties: false
      required: [userIds]
      properties:
        userIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: integer
            format: int32
            minimum: 1
            maximum: 2147483647
            description: A positive PostgreSQL integer ID.
      example:
        userIds: [2, 3]
    Enrollment:
      type: object
      properties:
        userId:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        courseId:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        role:
          type: string
          enum:
          - instructor
          - student
      required:
      - userId
      - courseId
      - role
    Announcement:
      type: object
      additionalProperties: false
      required: [id, courseId, authorId, title, body, isVisible, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/EntityId'
        courseId:
          $ref: '#/components/schemas/EntityId'
        authorId:
          $ref: '#/components/schemas/EntityId'
        title:
          type: string
        body:
          type: string
        isVisible:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateAnnouncementRequest:
      type: object
      additionalProperties: false
      required: [title, body]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Trimmed before validation; whitespace-only text is rejected.
        body:
          type: string
          minLength: 1
          maxLength: 20000
          description: Full announcement text, with surrounding whitespace trimmed.
        isVisible:
          type: boolean
          default: true
    UpdateAnnouncementRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 20000
        isVisible:
          type: boolean
    Assignment:
      type: object
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        title:
          type: string
        description:
          type: string
        dueAt:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - title
    Question:
      type: object
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        type:
          type: string
          enum:
          - multiple_choice
          - short_answer
          - true_false
        prompt:
          type: string
        options:
          type: array
          items:
            type: string
        points:
          type: number
      required:
      - id
      - type
      - prompt
    Quiz:
      type: object
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
          - draft
          - published
          - closed
        dueAt:
          type: string
          format: date-time
          nullable: true
        questions:
          type: array
          items:
            $ref: '#/components/schemas/Question'
      required:
      - id
      - title
      - status
    Submission:
      type: object
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        quizId:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        studentId:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        status:
          type: string
          enum:
          - draft
          - submitted
          - graded
        answers:
          type: array
          items:
            type: object
            properties:
              questionId:
                type: integer
                format: int32
                minimum: 1
                maximum: 2147483647
              answer: {}
            required:
            - questionId
            - answer
        grade:
          type: number
          nullable: true
        fileKey:
          type: string
          nullable: true
      required:
      - id
      - quizId
      - status
    Resource:
      type: object
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        title:
          type: string
        resourceType:
          type: string
          enum:
          - instructor_material
          - student_note
          - assignment_file
        ownerId:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        visibility:
          type: string
          enum:
          - visible
          - hidden
        extractionStatus:
          type: string
          enum:
          - pending
          - processing
          - completed
          - failed
        fileKey:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - title
      - resourceType
      - extractionStatus
      - ownerId
      - visibility
      - fileKey
      - createdAt
    SearchResult:
      type: object
      properties:
        resource:
          $ref: '#/components/schemas/Resource'
        matches:
          type: array
          items:
            type: object
            properties:
              page:
                type: integer
              snippet:
                type: string
    PresignedUrl:
      type: object
      properties:
        url:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
      required:
      - url
      - expiresAt
    AccessibleCourse:
      allOf:
      - $ref: '#/components/schemas/Course'
      - type: object
        required: [role]
        properties:
          role:
            type: string
            nullable: true
            enum: [student, instructor, null]
            description: Current user's course role, or null for an administrator without membership.
    Dashboard:
      type: object
      required: [course, view, readOnly, permissions, recentAnnouncements, upcomingAssessments, recentResources]
      properties:
        course:
          $ref: '#/components/schemas/AccessibleCourse'
        view:
          type: string
          enum: [student, instructor]
          description: Administrators receive the instructor view.
        readOnly:
          type: boolean
        permissions:
          $ref: '#/components/schemas/DashboardPermissions'
        recentAnnouncements:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/DashboardAnnouncement'
        upcomingAssessments:
          type: array
          maxItems: 5
          description: Assignments and quizzes with current or future deadlines, ordered by dueAt, type, and ID.
          items:
            $ref: '#/components/schemas/DashboardAssessment'
        recentResources:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/DashboardResource'
        activeAssessmentStatistics:
          type: array
          maxItems: 5
          description: Instructor/admin view only; visible assignments not past due and visible published quizzes currently open, with missing deadlines last.
          items:
            $ref: '#/components/schemas/ActiveAssessmentStatistics'
    DashboardPermissions:
      type: object
      required: [canPublishAnnouncements, canCreateAssessments, canManageResources, canReviewSubmissions]
      properties:
        canPublishAnnouncements:
          type: boolean
        canCreateAssessments:
          type: boolean
        canManageResources:
          type: boolean
        canReviewSubmissions:
          type: boolean
    DashboardAnnouncement:
      type: object
      required: [id, title, body, isVisible, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/EntityId'
        title:
          type: string
        body:
          type: string
        isVisible:
          type: boolean
        createdAt:
          type: string
          format: date-time
    DashboardAssessment:
      type: object
      required: [id, type, title, dueAt, opensAt, isVisible, status]
      properties:
        id:
          $ref: '#/components/schemas/EntityId'
        type:
          type: string
          enum: [assignment, quiz]
        title:
          type: string
        dueAt:
          type: string
          format: date-time
        opensAt:
          type: string
          format: date-time
          nullable: true
        isVisible:
          type: boolean
        status:
          type: string
          nullable: true
          description: Quiz status; null for assignments.
        submissionStatus:
          type: string
          enum: [not_started, draft, submitted, graded]
          description: Student view only; latest quiz attempt status or assignment submission status.
    DashboardResource:
      type: object
      required: [id, title, resourceType, ownerId, visibility, extractionStatus, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/EntityId'
        title:
          type: string
        resourceType:
          type: string
          enum: [instructor_material, student_note, assignment_file]
        ownerId:
          $ref: '#/components/schemas/EntityId'
        visibility:
          type: string
          enum: [visible, hidden]
        extractionStatus:
          type: string
          enum: [pending, processing, completed, failed]
        createdAt:
          type: string
          format: date-time
    ActiveAssessmentStatistics:
      type: object
      required: [assessmentId, type, title, eligibleStudents, submittedCount, gradedCount, submissionRate]
      properties:
        assessmentId:
          $ref: '#/components/schemas/EntityId'
        type:
          type: string
          enum: [assignment, quiz]
        title:
          type: string
        eligibleStudents:
          type: integer
          minimum: 0
          description: Active accounts currently enrolled as students in this course.
        submittedCount:
          type: integer
          minimum: 0
          description: Distinct eligible students with a submitted or graded quiz attempt, or an assignment file submission.
        gradedCount:
          type: integer
          nullable: true
          minimum: 0
          description: Distinct eligible students with a graded quiz attempt; null for assignments.
        submissionRate:
          type: number
          minimum: 0
          maximum: 1
          description: submittedCount divided by eligibleStudents, or zero when there are no eligible students.
    EntityId:
      type: integer
      format: int32
      minimum: 1
      maximum: 2147483647
    QuizStatistics:
      type: object
      properties:
        eligibleStudents:
          type: integer
        submittedCount:
          type: integer
        submissionRate:
          type: number
        gradedCount:
          type: integer
