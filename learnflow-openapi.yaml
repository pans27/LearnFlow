  /api/admin/users:
    post:
      x-implementation-status: implemented
      tags:
      - Administration
      operationId: post_api_admin_users
      summary: Create user with a generated temporary password
      description: Allows administrators to create a user with a server-generated temporary password returned once and mustChangePassword set to true.
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created; temporaryPassword is returned once and user.mustChangePassword is true
          headers:
            Cache-Control:
