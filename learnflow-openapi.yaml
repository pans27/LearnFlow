openapi: 3.0.3
info:
  title: LearnFlow REST API
  version: 0.1.0
  description: >-
    LearnFlow API contract for the current Express backend and planned feature endpoints.
    Operations marked x-implementation-status implemented are registered in the application;
    operations marked planned are not available yet and are retained for future implementation.
    Authentication uses the HttpOnly learnflow.sid JWT cookie backed by revocable PostgreSQL sessions.
    Admin operations require an active administrator account with no pending password change;
    course lists require enrollment for everyone, while individual course and dashboard reads allow membership or administrator access.
    Archived courses are administrator-only and read-only except for reactivation.
    IDs are positive int32 integers, all course data uses the single learnflow database schema,
    and error bodies contain only message (Unauthorized for 401 and Forbidden for 403).
    Temporary-password users may read their profile, log out, or change their password;
    password changes revoke all sessions and require another login.
servers:
- url: http://localhost:3000
  description: Local Express API
tags:
- name: Health
- name: Authentication
- name: Administration
- name: Courses
- name: Announcements
- name: Assignments
- name: Quizzes
- name: Quiz Submissions
- name: Resources
paths:
  /api/health:
    get:
      x-implementation-status: implemented
      tags: [Health]
      operationId: get_api_health
      summary: Check API process liveness
      description: Returns process health without checking PostgreSQL connectivity.
      security: []
      responses:
        '200':
          description: API process is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
        '500':
          description: Unexpected error; logged by the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: An unexpected error occurred
  /api/auth/change-password:
    post:
      x-implementation-status: implemented
      tags:
      - Authentication
      operationId: post_api_auth_change_password
      summary: Change own password, including required first-login reset
      description: Changes the authenticated user's password, clears mustChangePassword, and invalidates all sessions so they must log in again.
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed and all sessions invalidated; log in again with the new password.
          headers:
            Set-Cookie:
              description: Clears the learnflow.sid session cookie.
              schema:
                type: string
        '400':
          description: Invalid input, incorrect current password, password policy violation, or new password matches current password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Unauthorized
        '500':
          description: Unexpected error; logged by the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: An unexpected error occurred
  /api/auth/login:
    post:
      x-implementation-status: implemented
      tags:
      - Authentication
      operationId: post_api_auth_login
      summary: Log in and establish session
      description: Authenticates the user and returns mustChangePassword to indicate whether a restricted first-login session requires a password change.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated; mustChangePassword indicates whether a first-login reset is required
          headers:
            Set-Cookie:
              description: Sets learnflow.sid as an HttpOnly SameSite=Lax JWT cookie, expiring after seven days; Secure in production.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Unauthorized
        '400':
          description: Invalid login body, unknown fields, or invalid email/password length.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected error; logged by the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: An unexpected error occurred
  /api/auth/logout:
    post:
      x-implementation-status: implemented
      tags:
      - Authentication
      operationId: post_api_auth_logout
      summary: Log out and revoke the current session
      description: Clears the auth cookie; missing or invalid sessions are a successful no-op.
      security: []
      responses:
        '204':
          description: Logged out; session invalidated.
          headers:
            Set-Cookie:
              description: Clears the learnflow.sid cookie.
              schema:
                type: string
        '500':
          description: Unexpected error; logged by the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: An unexpected error occurred
  /api/auth/me:
    get:
      x-implementation-status: implemented
      tags:
      - Authentication
      operationId: get_api_auth_me
      summary: Get current authenticated user
      description: Returns the current user and mustChangePassword, including during first-login password reset.
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Unauthorized
        '500':
          description: Unexpected error; logged by the server.
          content:
            application/json:
