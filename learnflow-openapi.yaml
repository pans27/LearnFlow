components:
  parameters:
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: string
    courseId:
      name: courseId
      in: path
      required: true
      schema:
        type: string
    announcementId:
      name: announcementId
      in: path
      required: true
      schema:
        type: string
    assignmentId:
      name: assignmentId
      in: path
      required: true
      schema:
        type: string
    submissionId:
      name: submissionId
      in: path
      required: true
      schema:
        type: string
    quizId:
      name: quizId
      in: path
      required: true
      schema:
        type: string
    questionId:
      name: questionId
      in: path
      required: true
      schema:
        type: string
    resourceId:
      name: resourceId
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: connect.sid
      description: Example Express session cookie name; configure to match the implementation. Protect cookie-authenticated
        mutations against CSRF.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
      - error
      - message
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        isAdmin:
          type: boolean
        mustChangePassword:
          type: boolean
          readOnly: true
          description: True until the user replaces the administrator-generated temporary password.
      required:
      - id
      - email
      - isAdmin
      - mustChangePassword
    CreateUserRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        isAdmin:
          type: boolean
          default: false
          description: Global administrator status; student and instructor roles are assigned per course.
      required:
      - name
      - email
    CreateUserResponse:
      type: object
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/User'
        temporaryPassword:
          type: string
          format: password
          minLength: 16
          readOnly: true
          description: Server-generated random password, exposed only in the administrator's creation response.
      required:
      - user
      - temporaryPassword
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      properties:
        currentPassword:
          type: string
          format: password
          writeOnly: true
          description: Temporary password on first login; current password for subsequent changes.
        newPassword:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: Must be 12 to 128 characters and differ from the current password.
      required:
      - currentPassword
      - newPassword
    Course:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
          - active
          - archived
        role:
          type: string
          enum:
          - instructor
          - student
          nullable: true
      required:
      - id
      - name
      - status
    Enrollment:
      type: object
      properties:
        userId:
          type: string
        courseId:
          type: string
        role:
          type: string
          enum:
          - instructor
          - student
      required:
      - userId
      - courseId
      - role
    Announcement:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - title
      - body
    Assignment:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        dueAt:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - title
    Question:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - multiple_choice
          - short_answer
          - true_false
        prompt:
          type: string
        options:
          type: array
          items:
            type: string
        points:
          type: number
      required:
      - id
      - type
      - prompt
    Quiz:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
          - draft
          - published
          - closed
        dueAt:
          type: string
          format: date-time
          nullable: true
        questions:
          type: array
          items:
            $ref: '#/components/schemas/Question'
      required:
      - id
      - title
      - status
    Submission:
      type: object
      properties:
        id:
          type: string
        quizId:
          type: string
        studentId:
          type: string
        status:
          type: string
          enum:
          - draft
          - submitted
          - graded
        answers:
          type: array
          items:
            type: object
            properties:
              questionId:
                type: string
              answer: {}
            required:
            - questionId
            - answer
        grade:
          type: number
          nullable: true
        fileKey:
          type: string
          nullable: true
      required:
      - id
      - quizId
      - status
    Resource:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        resourceType:
          type: string
          enum:
          - instructor_material
          - student_note
          - assignment_file
        ownerId:
          type: string
        visibility:
          type: string
          enum:
          - visible
          - hidden
        extractionStatus:
          type: string
          enum:
          - pending
          - processing
          - completed
          - failed
        fileKey:
          type: string
      required:
      - id
      - title
      - resourceType
      - extractionStatus
    SearchResult:
      type: object
      properties:
        resource:
          $ref: '#/components/schemas/Resource'
        matches:
          type: array
          items:
            type: object
            properties:
              page:
                type: integer
              snippet:
                type: string
    PresignedUrl:
      type: object
      properties:
        url:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
      required:
      - url
    Dashboard:
      type: object
      properties:
        recentAnnouncements:
          type: array
          items:
            $ref: '#/components/schemas/Announcement'
        upcomingAssessments:
          type: array
          items:
            $ref: '#/components/schemas/Assignment'
        recentResources:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
    QuizStatistics:
      type: object
      properties:
        eligibleStudents:
          type: integer
        submittedCount:
          type: integer
        submissionRate:
          type: number
        gradedCount:
          type: integer
