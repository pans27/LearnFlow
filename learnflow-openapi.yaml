openapi: 3.0.3
info:
  title: LearnFlow REST API
  version: 0.1.0
  description: Proposed API contract based on the LearnFlow project proposal. Assignment-file submission routes
    are optional; quiz drafts stored in PostgreSQL before final S3 archival are a suggested implementation choice.
    All course endpoints require membership or administrator authorization; archived courses are administrator-only
    and read-only. Route parameters are IDs, not schema names; server resolves authorized course schema. Presigned
    URLs must be short-lived and authorization-checked. Instructor and administrator restrictions are described
    in operation text and must be implemented in middleware.
servers:
- url: http://localhost:3000
  description: Local Express API
tags:
- name: Authentication
- name: Administration
- name: Courses
- name: Announcements
- name: Assignments
- name: Quizzes
- name: Quiz Submissions
- name: Resources
paths:
  /api/auth/register:
    post:
      tags:
      - Authentication
      operationId: post_api_auth_register
      summary: Register account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
              required:
              - name
              - email
              - password
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid input
        '401':
          description: Not authenticated
        '403':
          description: Insufficient permission
        '404':
          description: Not found
  /api/auth/login:
    post:
      tags:
      - Authentication
      operationId: post_api_auth_login
      summary: Log in and establish session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
              - email
              - password
      responses:
        '201':
          description: Success
          content:
            application/json:
