openapi: 3.0.3
info:
  title: LearnFlow REST API
  version: 0.1.0
  description: Proposed API contract based on the LearnFlow project proposal. Assignment-file submission routes
    are optional; quiz drafts stored in PostgreSQL before final S3 archival are a suggested implementation choice.
    All course endpoints require membership or administrator authorization; archived courses are administrator-only
    and read-only. Route parameters are IDs, not schema names; server resolves authorized course schema. Presigned
    URLs must be short-lived and authorization-checked. Instructor and administrator restrictions are described
    in operation text and must be implemented in middleware. Accounts are created only by administrators;
    public registration is not supported. New accounts must replace their generated temporary password
    on first login. While mustChangePassword is true, middleware permits only GET /api/auth/me,
    POST /api/auth/change-password, and POST /api/auth/logout; all other protected operations return
    403 with error PASSWORD_CHANGE_REQUIRED, including administrator operations. Check this persisted
    user flag on every protected request. The initial administrator is provisioned outside the public API.
servers:
- url: http://localhost:3000
  description: Local Express API
tags:
- name: Authentication
- name: Administration
- name: Courses
- name: Announcements
- name: Assignments
- name: Quizzes
- name: Quiz Submissions
- name: Resources
paths:
  /api/auth/change-password:
    post:
      tags:
      - Authentication
      operationId: post_api_auth_change_password
      summary: Change own password, including required first-login reset
      description: Changes the authenticated user's password, clears mustChangePassword, and invalidates all sessions so they must log in again.
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed and all sessions invalidated; log in again with the new password.
          headers:
            Set-Cookie:
              description: Clears the connect.sid session cookie.
              schema:
                type: string
        '400':
          description: Invalid input, password policy violation, or new password matches current password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, invalid, or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Current password is incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/login:
    post:
      tags:
      - Authentication
      operationId: post_api_auth_login
      summary: Log in and establish session
      description: Authenticates the user and returns mustChangePassword to indicate whether a restricted first-login session requires a password change.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  writeOnly: true
              required:
              - email
              - password
      responses:
        '200':
          description: Authenticated; mustChangePassword indicates whether a first-login reset is required
          headers:
            Set-Cookie:
              description: Sets connect.sid as an HttpOnly session cookie; use Secure over HTTPS and SameSite protection.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Login failed for any reason, including invalid input, invalid credentials, or an inactive account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/logout:
    post:
      tags:
      - Authentication
      operationId: post_api_auth_logout
      description: Log out and invalidate session
      security:
      - sessionCookie: []
      responses:
        '204':
          description: Logged out; session invalidated
  /api/auth/me:
    get:
      tags:
      - Authentication
      operationId: get_api_auth_me
      summary: Get current authenticated user
      description: Returns the current user and mustChangePassword, including during first-login password reset.
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/admin/users:
    post:
      tags:
      - Administration
      operationId: post_api_admin_users
      summary: Create user with a generated temporary password
      description: Allows administrators to create a user with a server-generated temporary password returned once and mustChangePassword set to true.
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created; temporaryPassword is returned once and user.mustChangePassword is true
          headers:
            Cache-Control:
              description: Prevent storage of the response containing the temporary password.
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserResponse'
        '400':
          description: Invalid input, including a caller-supplied password or unknown field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Administrator permission required or PASSWORD_CHANGE_REQUIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: A user with this email already exists (case-insensitive)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
      - Administration
      operationId: get_api_admin_users
      summary: List users
      description: Administrator only.
      security:
      - sessionCookie: []
      responses:
        '200':
