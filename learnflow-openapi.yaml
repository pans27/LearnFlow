              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Forbidden
        '409':
          description: A user with this email already exists (case-insensitive)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected error; logged by the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: An unexpected error occurred
    get:
      x-implementation-status: implemented
      tags:
      - Administration
      operationId: get_api_admin_users
      summary: List users
      description: Administrator only.
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Returns an empty array when no items match.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Forbidden
        '500':
          description: Unexpected error; logged by the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: An unexpected error occurred
  /api/admin/users/{userId}:
    get:
      x-implementation-status: implemented
